name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Run PowerShell GUI self-test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\GEOGetter.ps1 -SelfTest

      - name: Install Inno Setup for release preflight
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build release artifacts for release preflight
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build_release.ps1 -BuildInstaller -PythonVersion "3.14.5"
