name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_PYTHON_VERSION: "3.14.5"

jobs:
  build-release:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.RELEASE_PYTHON_VERSION }}

      - name: Validate tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with v: $tag"
          }
          $tagVersion = $tag.Substring(1)
          $sourceVersion = (python -c "from geo_getter import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceVersion)) {
            throw "Could not read source version from geo_getter.__version__"
          }
          if ($sourceVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match geo_getter.__version__ $sourceVersion"
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main for release tag ancestry validation."
          }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Could not resolve release tag commit: $tag"
          }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $tag must point to a commit reachable from origin/main."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build release artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\build_release.ps1 -BuildInstaller -PythonVersion "${{ env.RELEASE_PYTHON_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GEOGetter-Setup-v*.exe
            dist/GEOGetter-v*-win-x64-portable.zip
